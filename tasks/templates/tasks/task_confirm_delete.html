{% extends 'tasks/base.html' %}
{% block title %}Delete Task{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Delete Task</h2>
        <p>Are you sure you want to delete <strong>{{ task.title }}</strong>? This can't be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'task_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
